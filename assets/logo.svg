<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Bookfinch logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2F8F"/>
      <stop offset="1" stop-color="#0B7F8C"/>
    </linearGradient>
    <linearGradient id="bird" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC857"/>
      <stop offset="1" stop-color="#FF8C42"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>

  <g transform="translate(-6 -38)">
    <!-- tail -->
    <rect x="0" y="-19" width="135" height="38" rx="19" transform="translate(168 306) rotate(145)" fill="#E86A2A"/>
    <!-- body -->
    <ellipse cx="250" cy="290" rx="120" ry="88" transform="rotate(-18 250 290)" fill="url(#bird)"/>
    <ellipse cx="288" cy="333" rx="74" ry="40" transform="rotate(-18 288 333)" fill="#FFE6B0"/>
    <!-- head -->
    <circle cx="348" cy="205" r="62" fill="#FFB84D"/>
    <!-- beak -->
    <path d="M396 190 L452 214 L398 233 Z" fill="#FFF0C9" stroke="#FFF0C9" stroke-width="8" stroke-linejoin="round"/>
    <!-- eye -->
    <circle cx="367" cy="196" r="10" fill="#1B1F4B"/>
    <circle cx="370.5" cy="192.5" r="3.4" fill="#FFFFFF"/>

    <!-- wing: three book pages fanned like feathers -->
    <g transform="translate(268 276)" stroke="#1B1F4B" stroke-opacity="0.22" stroke-width="3" stroke-linejoin="round">
      <path transform="rotate(-120)" d="M0 0 C-31 -36 -35 -104 -12 -152 Q0 -172 12 -152 C35 -104 31 -36 0 0 Z" fill="#B9C8FF"/>
      <path transform="rotate(-97)" d="M0 0 C-31 -36 -35 -104 -12 -152 Q0 -172 12 -152 C35 -104 31 -36 0 0 Z" fill="#DCE6FF"/>
      <g transform="rotate(-74)">
        <path d="M0 0 C-31 -36 -35 -104 -12 -152 Q0 -172 12 -152 C35 -104 31 -36 0 0 Z" fill="#FFFFFF"/>
        <g stroke="#8E9FD6" stroke-opacity="0.95" stroke-width="5" stroke-linecap="round">
          <line x1="-13" y1="-132" x2="13" y2="-132"/>
          <line x1="-17" y1="-111" x2="17" y2="-111"/>
          <line x1="-17" y1="-90" x2="14" y2="-90"/>
          <line x1="-14" y1="-69" x2="6" y2="-69"/>
        </g>
      </g>
    </g>

    <!-- legs -->
    <g stroke="#FF9F43" stroke-width="10" stroke-linecap="round">
      <line x1="288" y1="366" x2="288" y2="404"/>
      <line x1="326" y1="360" x2="326" y2="404"/>
    </g>
    <!-- closed book used as a perch -->
    <rect x="136" y="400" width="262" height="54" rx="14" fill="#F2545B"/>
    <rect x="150" y="434" width="236" height="12" rx="6" fill="#FFF3DA"/>
    <rect x="136" y="400" width="26" height="54" rx="12" fill="#C93C48"/>
  </g>
</svg>
