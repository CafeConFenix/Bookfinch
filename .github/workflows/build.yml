name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install -r requirements-build.txt
      - name: Build (portable folder)
        run: python -m PyInstaller --noconfirm --clean bookfinch.spec
      - name: Build (single .exe)
        run: python -m PyInstaller --noconfirm --clean bookfinch-onefile.spec
      - name: Prepare packages
        shell: pwsh
        run: |
          Copy-Item portable.txt dist\Bookfinch\
          Compress-Archive -Path dist\Bookfinch\* -DestinationPath Bookfinch-portable.zip
          Copy-Item portable.txt dist\
          Compress-Archive -Path dist\Bookfinch.exe, dist\portable.txt -DestinationPath Bookfinch-onefile.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Bookfinch-windows
          path: |
            Bookfinch-portable.zip
            Bookfinch-onefile.zip
